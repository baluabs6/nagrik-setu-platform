server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for the SPA bundle
    gzip on;
    gzip_types text/css application/javascript application/json;

    # SPA routing: let React Router handle unknown paths client-side,
    # which is what renders the TSX 404 page for bad in-app routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls straight through to Django in the same compose network /
    # k8s service mesh, so the browser only ever talks to one origin.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 400 /errors/400;
        error_page 403 /errors/403;
        error_page 404 /errors/404;
        error_page 500 502 503 504 /errors/500;
    }

    # Infra-level errors (nginx/ALB itself failing before Django is reached)
    # fall back to the same branded static pages, served client-side.
    error_page 400 /index.html;
    error_page 401 /index.html;
    error_page 403 /index.html;
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
