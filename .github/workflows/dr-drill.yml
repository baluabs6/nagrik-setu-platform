name: DR Drill (Azure)

# Runs monthly so the Azure DR stack doesn't silently bit-rot between real
# incidents. This validates the stack still applies cleanly and the AKS
# manifests are well-formed — it does NOT shift live traffic. An actual
# failover drill (promoting the Postgres replica, flipping Traffic Manager)
# should be a separate, deliberately human-triggered runbook.
on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  validate-dr-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure Azure credentials
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: terraform plan (Azure DR) — no apply
        working-directory: infra/terraform/azure-dr
        env:
          TF_VAR_postgres_replica_admin_password: ${{ secrets.DR_POSTGRES_PASSWORD }}
        run: |
          terraform init
          terraform plan -detailed-exitcode

      - name: Validate Kubernetes manifests
        run: |
          curl -sLO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          ./kubectl apply --dry-run=client -f infra/k8s-dr/deployment.yaml
