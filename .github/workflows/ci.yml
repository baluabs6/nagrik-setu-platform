name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-key
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-key
        run: pytest --cov=apps --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Run tests
        working-directory: frontend
        run: npx vitest run

      - name: Production build
        working-directory: frontend
        run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [aws, azure-dr]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform fmt check
        working-directory: infra/terraform/${{ matrix.stack }}
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, validate only)
        working-directory: infra/terraform/${{ matrix.stack }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/terraform/${{ matrix.stack }}
        run: terraform validate

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nagrik-setu-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t nagrik-setu-frontend:ci ./frontend

  # Runs only on pushes to main, after everything above passes. Pushes
  # images to ECR and ACR, then triggers `terraform apply` for the AWS
  # stack. The Azure DR stack is applied manually/on a schedule, not on
  # every merge, since it's a standby environment rather than live traffic.
  deploy-aws:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, terraform-validate, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/nagrik-setu-backend:$TAG ./backend
          docker build -t $REGISTRY/nagrik-setu-frontend:$TAG ./frontend
          docker push $REGISTRY/nagrik-setu-backend:$TAG
          docker push $REGISTRY/nagrik-setu-frontend:$TAG

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform apply (AWS)
        working-directory: infra/terraform/aws
        run: |
          terraform init
          terraform apply -auto-approve
